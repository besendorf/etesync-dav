name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_pyinstaller:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps .

      - name: Verify dependencies and tests
        run: |
          python -m pip check
          python -m unittest discover -v

      - name: Build binaries
        shell: bash
        run: |
          cd pyinstaller
          ./bundle.sh

      - name: Generate dependency SBOM
        run: pip-audit --require-hashes -r requirements.txt --format cyclonedx-json --output pyinstaller/deploy/sbom.json

      - name: Generate release checksums
        run: python scripts/generate_checksums.py pyinstaller/deploy

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: ./pyinstaller/deploy/*
          if-no-files-found: error
