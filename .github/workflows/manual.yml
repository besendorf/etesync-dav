name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build and publish (leave blank for a validation build)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build_pyinstaller:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, ubuntu-22.04-arm]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.10'
          cache: pip

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps .

      - name: Verify dependencies and tests
        run: |
          python -m pip check
          python -m unittest discover -v

      - name: Build binaries
        shell: bash
        run: |
          cd pyinstaller
          ./bundle.sh

      - name: Generate dependency SBOM
        run: pip-audit --require-hashes --disable-pip -r requirements.txt --format cyclonedx-json --output pyinstaller/deploy/sbom.json

      - name: Generate release checksums
        run: python scripts/generate_checksums.py pyinstaller/deploy

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}
          path: ./pyinstaller/deploy/*
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: build_pyinstaller
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t files < <(find release -maxdepth 1 -type f -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "EteSync DAV $RELEASE_TAG" \
              "${files[@]}"
          fi
